<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Paint App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-paintbrush"></i> Mini Paint Board</h2>
        
        <div class="toolbar">
            <div class="tool">
                <label>Color:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>
            <div class="tool">
                <label>Brush Size:</label>
                <input type="range" id="brushSize" min="1" max="50" value="5">
            </div>
            <button id="clearBtn"><i class="fa-solid fa-trash"></i> Clear</button>
            <button id="saveBtn"><i class="fa-solid fa-download"></i> Save</button>
        </div>

        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
