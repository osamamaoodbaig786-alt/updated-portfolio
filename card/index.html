<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <!-- Profile Image -->
        <div class="img-container">
            <img src="profile.jpg" alt="Muhammad Osama Maood Baig">
        </div>

        <!-- Name -->
        <h2>muhammad osama maood <br>baig</h2>

        <!-- Role -->
        <p class="role">Web Development Student</p>

        <!-- Description -->
        <p class="description">
            Mujhe nayi websites banana aur coding seekhna pasand hai. Main abhi HTML aur CSS seekh raha hoon.
        </p>

        <!-- Tech Badges -->
        <div class="skills">
            <span>HTML5</span>
            <span>CSS3</span>
            <span>JavaScript</span>
        </div>

        <!-- Corrected Contact Button -->
        <a href="#" class="contact-btn">Contact Me</a>
        
    </div>

</body>
</html>
